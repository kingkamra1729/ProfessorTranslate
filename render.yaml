# Render blueprint — the whole of Suvidha, one service.
#
# The server builds and serves the frontend itself, so the professor console,
# the student view, the REST API and the WebSocket all sit behind a single
# origin. That removes, by construction, the three things most likely to break a
# split deployment the night before a demo: CORS, mixed content (an https page
# cannot open a ws:// socket), and a frontend baked against a stale server URL.
#
# It also has to be one always-on service rather than serverless. A lecture room
# is a live in-memory object holding the professor's socket and every student's
# socket, open for the length of a class.
#
# Deploy:  push to GitHub, then New > Blueprint on render.com and pick the repo.
# Set the keys in the dashboard when prompted - never in this file.

services:
  - type: web
    name: suvidha
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # sync:false means "prompt me in the dashboard, keep it out of the repo".
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: WOLFRAM_APP_ID
        sync: false
      - key: WOLFRAM_CLOUD_API_URL
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

      - key: NODE_VERSION
        value: "22"

      # Serve the built frontend from this same process. This is what makes it
      # one service instead of two.
      - key: SERVE_STATIC
        value: "true"

      # Everything is same-origin here, so no allow-list is needed.
      - key: ALLOWED_ORIGINS
        value: ""

      # Render's free tier has an ephemeral filesystem: recordings written here
      # are lost on redeploy. Attach a disk and point DATA_DIR at it to keep
      # them. Live lectures are unaffected either way.
      - key: DATA_DIR
        value: /opt/render/project/src/data
